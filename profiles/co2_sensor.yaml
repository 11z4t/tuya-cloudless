name: "CO2 / Air Quality Sensor"
model: "co2*"
entities:
  - platform: sensor
    name: co2
    dp_value: {id: "2", type: int}
    device_class: carbon_dioxide
    unit: ppm
    state_class: measurement
  - platform: sensor
    name: temperature
    dp_value: {id: "18", type: int, scale: 0.1}
    device_class: temperature
    unit: "°C"
    state_class: measurement
  - platform: sensor
    name: humidity
    dp_value: {id: "19", type: int}
    device_class: humidity
    unit: "%"
    state_class: measurement
