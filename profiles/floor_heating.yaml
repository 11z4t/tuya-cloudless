name: "Floor Heating"
model: "floor*"
entities:
  - platform: climate
    name: floor_heater
    dp_power: {id: "1", type: bool}
    dp_mode: {id: "2", type: enum}
    dp_temp_set: {id: "3", type: int, min_raw: 5, max_raw: 35, scale: 1}
    dp_temp_current: {id: "4", type: int, scale: 1}
    dp_options: ["manual", "eco"]
    target_min: 5
    target_max: 35
    step: 0.5
  - platform: sensor
    name: floor_temp
    dp_value: {id: "6", type: int, scale: 1}
    device_class: temperature
    unit: "°C"
    state_class: measurement
