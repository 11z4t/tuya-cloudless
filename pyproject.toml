[project]
name = "tuya-cloudless"
version = "0.1.0"
description = "Cloud-free local control for Tuya WiFi devices via Home Assistant"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "cryptography>=42.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ble = [
    "bleak>=0.21",
]
qr = [
    "qrcode[svg]>=7.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "ruff>=0.4.0",
    "mypy>=1.9",
    "bandit>=1.7",
    "detect-secrets>=1.4",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["lib"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation must precede HA imports — E402 is unavoidable here
"custom_components/tuya_cloudless/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tuya_cloudless.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
asyncio_mode = "auto"
markers = [
    "integration: requires real hardware or network",
    "requires_ha: requires Home Assistant dependencies",
    "requires_ble: requires Bluetooth hardware and bleak installed",
]
filterwarnings = [
    # Python 3.12 AsyncMock internal bug: _execute_mock_call coroutines occasionally
    # leak when a mock is called with side_effect/return_value.  Fixed in Python 3.13.
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    # Tests that verify hass.async_create_task call-count deliberately use MagicMock,
    # which stores coroutines as call-args without running them.  The background-task
    # coroutines (_auto_stop_after_idle, _broadcast_sse, _resume_flow) are exercised in
    # dedicated unit tests; the warnings here are a test-infrastructure artefact only.
    "ignore:coroutine 'PairingServer._auto_stop_after_idle' was never awaited:RuntimeWarning",
    "ignore:coroutine 'PairingServer._broadcast_sse' was never awaited:RuntimeWarning",
    "ignore:coroutine 'PairingServer._handle_activate.<locals>._resume_flow' was never awaited:RuntimeWarning",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.detect-secrets]
exclude_files = '(\.git/.*|strings\.json|translations/.*\.json)'
